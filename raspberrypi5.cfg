# OpenOCD SWD flashing from a Raspberry Pi 5 (elspi), bitbanged over GPIO.
#
# NEVER TESTED AGAINST HARDWARE. Written 2026-08-16 and parked the same day: the
# ST-Link is already wired, so bitbanging from the Pi is slower and needs proving
# out first -- a net loss today. Kept because the analysis below is the expensive
# part and would otherwise be re-derived, and because a board respin is when this
# becomes worth having.
#
# STILL UNKNOWN: whether SWD is physically wired from the Pi's GPIO 24/25 to the
# STM32 at all. raspberry.cfg implies someone intended it and both pins are
# unclaimed, but neither is proof. `sudo openocd -f raspberrypi5.cfg` with the
# program line removed is the read-only probe that would settle it.
#
# WHY THIS FILE EXISTS SEPARATELY FROM raspberry.cfg. That one sources
# interface/raspberrypi2-native.cfg, which is the `bcm2835gpio` driver: it
# reaches the GPIO block by memory-mapping the BCM2835/6/7 peripheral base
# directly. The Pi 5 moved GPIO off the SoC entirely and onto the RP1
# southbridge, so that driver has nothing to map and cannot work here at all --
# not "slower", not "needs tuning", it is the wrong peripheral. raspberry.cfg is
# kept as-is for any older Pi; this is the one that works on elspi.
#
# `linuxgpiod` goes through the kernel's GPIO character device instead, which is
# the supported path on Pi 5. Verified on elspi 2026-08-16: header GPIOs are on
# gpiochip0 (54 lines), with GPIO24 and GPIO25 present and unclaimed.
#
# Pin assignment is unchanged from raspberry.cfg -- SWCLK on GPIO25, SWDIO on
# GPIO24 -- because that is how the board is wired, not a preference.
#
# EXPECT THIS TO BE SLOW. Bitbanging SWD through the character device costs a
# syscall per edge, so it runs at a few hundred kHz rather than the megahertz an
# ST-Link manages. Flashing ~38 KB takes a minute or two. That is a fine trade
# for not needing the laptop, but do not read the pace as a fault.
#
# Usage (on elspi, from the repo root, with the firmware already built):
#     sudo openocd -f raspberrypi5.cfg
# Override the image without editing this file:
#     sudo openocd -f raspberrypi5.cfg -c "set FW_ELF build-diag/reflex-fw.elf"
#
# Root is required: /dev/gpiochip0 is root-owned. Adding the operator to a gpio
# group would avoid that, but a group change on the machine that runs the lathe
# is a deliberate decision, not a side effect of wanting to flash something.

adapter driver linuxgpiod
adapter gpiochip 0

adapter gpio swclk -chip 0 25
adapter gpio swdio -chip 0 24

transport select swd

source [find target/stm32f4x.cfg]

# Which image to flash. Defaults to the release build; the diagnostic build
# lives in build-diag/ and is selected with -c "set FW_ELF ..." above rather
# than by editing this line, so the two never get confused in a hurry.
if { ![info exists FW_ELF] } {
    set FW_ELF build/reflex-fw.elf
}

init
program $FW_ELF verify reset
shutdown
